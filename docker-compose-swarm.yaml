version: '3.8'

# Ordem de inicialização garantida por healthchecks:
#   database → (redis em paralelo) → app → nginx
#                                  → celery
#                                  → flower
#
# depends_on é ignorado pelo Swarm; os serviços sobem todos ao mesmo tempo.
# A resiliência vem do restart_policy + healthcheck: serviços que dependem
# de DB/Redis vão falhar e reiniciar até que os healthchecks passem.

services:

  # ── Banco de Dados (MariaDB) ──────────────────
  database:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: "grassato-3d"
      MYSQL_ROOT_PASSWORD: "anna"
      MYSQL_USER: "diego"
      MYSQL_PASSWORD: "anna"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-panna"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      placement:
        constraints:
          - node.role == manager

  # ── Cache / Fila (Redis) ──────────────────────
  redis:
    image: redis:7.4-bookworm
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s

  # ── Django + Gunicorn ─────────────────────────
  app:
    image: diegograssato/grassato-3d-printer:latest
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      SECRET_KEY: "AsdkaoskoaAqeqwowqw3"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,10.22.0.96,150.136.151.56,grassato-makers.duckdns.org"
      CSRF_TRUSTED_ORIGINS: "http://grassato-makers.duckdns.org,https://grassato-makers.duckdns.org,http://10.22.0.96:8080,http://localhost,http://127.0.0.1"
      ML_CALLBACK_URI: "https://grassato-makers.duckdns.org/integracoes/ml/callback/"
      USE_X_FORWARDED_HOST: "True"
      HTTP_X_FORWARDED_PROTO: "http"
      DB_ENGINE: mysql
      DB_NAME: "grassato-3d"
      DB_USER: "diego"
      DB_PASSWORD: "anna"
      DB_HOST: tasks.database
      DB_PORT: "3306"
      REDIS_URL: "redis://redis:6379/0"
      GUNICORN_WORKERS: "3"
      GUNICORN_THREADS: "4"
      DJANGO_SUPERUSER_USERNAME: "admin"
      DJANGO_SUPERUSER_EMAIL: "diego.grassato@gmail.com"
      DJANGO_SUPERUSER_PASSWORD: "admin123"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    expose:
      - 8000
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: start-first      # sobe novo container antes de derrubar o antigo

  # ── Nginx (proxy reverso + static files) ─────
  nginx:
    image: diegograssato/nginx_app_web:latest
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - target: 80
        published: 8080
        mode: ingress
    volumes:
      - static_files:/usr/share/nginx/html/static:ro 
      - media_files:/usr/share/nginx/html/media:ro
    networks:
      - backend
      - npm_public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  # ── Celery Worker ─────────────────────────────
  celery:
    image: diegograssato/grassato-3d-printer:latest
    stop_grace_period: 120s   # tempo para tasks em andamento terminarem
    command: >
      celery -A config worker
      --loglevel=info
      --queues=ml_oauth,ml_orders,ml_status,ml_sync,default
      --concurrency=2
      --hostname=celery@%h
    healthcheck:
      # Verifica se o processo PID 1 é o celery worker (exec no entrypoint garante isso).
      # Evita carregar Django+Redis a cada check — leve e confiável em ARM.
      test: ["CMD-SHELL", "grep -q celery /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      SECRET_KEY: "AsdkaoskoaAqeqwowqw3"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,10.22.0.96,150.136.151.56,grassato-makers.duckdns.org"
      CSRF_TRUSTED_ORIGINS: "http://grassato-makers.duckdns.org,https://grassato-makers.duckdns.org,http://10.22.0.96:8080,http://localhost,http://127.0.0.1"
      ML_CALLBACK_URI: "https://grassato-makers.duckdns.org/integracoes/ml/callback/"
      USE_X_FORWARDED_HOST: "True"
      HTTP_X_FORWARDED_PROTO: "http"
      DB_ENGINE: mysql
      DB_NAME: "grassato-3d"
      DB_USER: "diego"
      DB_PASSWORD: "anna"
      DB_HOST: tasks.database
      DB_PORT: "3306"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first       # stop-first: tasks em andamento terminam antes do novo subir

  # ── Celery Flower (Monitoramento Web) ─────────
  flower:
    image: diegograssato/grassato-3d-printer:latest
    command: >
      celery -A config flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
      --inspect_timeout=5000
    healthcheck:
      # /proc/net/tcp lista todos os sockets TCP do kernel.
      # 5555 em hex = 0x15B3 → busca ':15B3 ' na tabela de sockets.
      # Zero overhead: leitura de arquivo, sem Python, sem rede — ARM-safe.
      test: ["CMD-SHELL", "grep -q ':15B3 ' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    ports:
      - target: 5555
        published: 5555
        mode: host
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s

volumes:
  static_files:
  media_files:
  redis_data:
  mysql_data:

networks:
  backend:
    external: true
  npm_public:
    external: true
