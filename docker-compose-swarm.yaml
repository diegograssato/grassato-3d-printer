version: '3.8'

services:
  # ── Banco de Dados (MySQL) ────────────────────
  database:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: "grassato-3d"
      MYSQL_ROOT_PASSWORD: "anna"
      MYSQL_USER: "diego"
      MYSQL_PASSWORD: "anna"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  # ── Cache / Fila (Redis) ──────────────────────
  redis:
    image: redis:7-alpine
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  # ── Django + Gunicorn ─────────────────────────
  app:
    image: diegograssato/grassato-3d-printer:latest
    environment:
      SECRET_KEY: "AsdkaoskoaAqeqwowqw3"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,10.22.0.96,grassato-makers.duckdns.org"
      CSRF_TRUSTED_ORIGINS: "http://grassato-makers.duckdns.org,https://grassato-makers.duckdns.org,http://10.22.0.96:8080,http://localhost,http://127.0.0.1"
      USE_X_FORWARDED_HOST: "True"
      HTTP_X_FORWARDED_PROTO: "http"
      DB_ENGINE: mysql
      DB_NAME: "grassato-3d"
      DB_USER: "diego"
      DB_PASSWORD: "anna"
      DB_HOST: tasks.database
      DB_PORT: "3306"
      REDIS_URL: "redis://redis:6379" # Alterado de IP para o nome do serviço
      GUNICORN_WORKERS: "3"
      GUNICORN_THREADS: "4"
      DJANGO_SUPERUSER_USERNAME: "admin"
      DJANGO_SUPERUSER_EMAIL: "diego.grassato@gmail.com"
      DJANGO_SUPERUSER_PASSWORD: "admin123"
    ports:
      - target: 8000
        published: 8000
        mode: ingress
    expose:
      - 8000
    volumes:
      - static_files:/app/staticfiles
    networks:
      - backend
    depends_on:
      - database
      - redis
    deploy:
      mode: replicated
      replicas: 4
      restart_policy:
        condition: on-failure

  # ── Nginx (proxy reverso + static files) ─────
  nginx:
    image: diegograssato/nginx_app_web:latest
    ports:
      - target: 80
        published: 8080
        mode: ingress
    volumes:
      - static_files:/usr/share/nginx/html/static:ro 
    networks:
      - backend
      - npm_public
    depends_on:
      - app
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure  

volumes:
  static_files:
  mysql_data:                   # Volume persistente para o banco de dados

networks:
  backend:
    external: true  
  npm_public:
    external: true    
