{% extends "base.html" %}
{% block title %}Excluir Movimentação{% endblock %}

{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{% url 'caixa:caixa_list' %}">Caixa</a></li>
<li class="breadcrumb-item active">Excluir</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white py-3">
        <h5 class="mb-0"><i class="bi bi-trash me-2"></i>Confirmar Exclusão</h5>
      </div>
      <div class="card-body p-4">
        <p>Deseja excluir a movimentação <strong>{{ objeto }}</strong>?</p>
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i>Sim, excluir
          </button>
          <a href="{% url 'caixa:caixa_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
