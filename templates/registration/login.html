<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Grassato's 3D Maker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 60%, #0a3d62 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: #fff; border-radius: 1rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
      padding: 2.5rem 2rem;
    }
    .brand-icon { font-size: 2.5rem; color: #0d6efd; }
    .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 .2rem rgba(13,110,253,.2); }
    .btn-login { background: linear-gradient(90deg,#0d6efd,#0a58ca); border: none; }
    .btn-login:hover { background: linear-gradient(90deg,#0a58ca,#084298); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <i class="bi bi-printer-fill brand-icon"></i>
      <h5 class="fw-bold mt-2 mb-0">Grassato's 3D Maker</h5>
      <small class="text-muted">Sistema de Gestão</small>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle me-1"></i>
      Usuário ou senha inválidos. Tente novamente.
    </div>
    {% endif %}

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="mb-3">
        <label for="id_username" class="form-label fw-semibold small">Usuário</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" id="id_username"
                 class="form-control" placeholder="Digite seu usuário"
                 autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="mb-4">
        <label for="id_password" class="form-label fw-semibold small">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="id_password"
                 class="form-control" placeholder="Digite sua senha"
                 autocomplete="current-password" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1">
            <i class="bi bi-eye" id="togglePwdIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-login btn-primary w-100 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
      </button>
    </form>

    <hr class="my-3">
    <p class="text-center text-muted mb-0" style="font-size:.75rem">
      Acesso restrito — somente usuários autorizados.
    </p>
  </div>

  <script>
    const btn  = document.getElementById('togglePwd');
    const icon = document.getElementById('togglePwdIcon');
    const pwd  = document.getElementById('id_password');
    btn.addEventListener('click', () => {
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  </script>
</body>
</html>
