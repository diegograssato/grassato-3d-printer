{% extends 'base.html' %}
{% block title %}Remover Vínculo{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body text-center py-5">
        <i class="bi bi-x-circle-fill text-danger" style="font-size:2.5rem"></i>
        <h5 class="mt-3">Remover vínculo?</h5>
        <p class="text-muted small">
          O produto <strong>{{ pi.produto }}</strong> será desvinculado de
          <strong>{{ pi.integracao }}</strong>.<br>
          O anúncio <code>{{ pi.sku_externo }}</code> permanece no MercadoLivre.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <a href="{% url 'integracoes:integracao_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Remover vínculo</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
