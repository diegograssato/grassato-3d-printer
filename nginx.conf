upstream django {
    server app:8000;
    keepalive 32; # Mantém conexões abertas com o Gunicorn/Django
}

server {
    listen 80;
    server_name _;

    # Tamanho máximo do upload (imagens ML: até 10 MB × várias fotos)
    client_max_body_size      100M;

    # Otimizações de rede globais para o servidor
    tcp_nopush                on;
    tcp_nodelay               on;

    # Proxy timeouts generosos para uploads lentos
    proxy_connect_timeout     10s;
    proxy_send_timeout        120s;
    proxy_read_timeout        120s;

    # Ativa compressão Gzip para reduzir uso de banda em texto/assets
    gzip                      on;
    gzip_vary                 on;
    gzip_proxied              any;
    gzip_comp_level           5;
    gzip_types                text/plain text/css application/json application/javascript text/xml application/xml;

    # O DNS interno do Docker (Obrigatório para resolver a variável abaixo)
    resolver 127.0.0.11 valid=5s;
    
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off; # Reduz I/O de disco inútil
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/static/favicon.svg;
        add_header Content-Type "image/svg+xml";
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off; # Reduz I/O de disco para as mídias salvas
    }

    location / {
        proxy_pass                http://django;
        
        # Cabeçalhos HTTP padrão e otimizados
        proxy_set_header          Host              $host;
        proxy_set_header          X-Real-IP         $remote_addr;
        proxy_set_header          X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header          X-Forwarded-Proto $scheme;
        
        # Suporte ao keepalive do upstream
        proxy_http_version        1.1;
        proxy_set_header          Connection        "";

        # Desabilita o buffering do request body no nginx:
        # o body é enviado diretamente ao upstream (Gunicorn) em streaming,
        # eliminando a gravação em arquivo temporário e o [warn] associado.
        proxy_request_buffering   off;
        
        # Otimização opcional: desbanca buffering de resposta se o Django enviar dados em streaming
        proxy_buffering           on; 
        proxy_buffer_size         8k;
        proxy_buffers             8 8k;
    }
}
