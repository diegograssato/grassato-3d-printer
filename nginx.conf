upstream django {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Tamanho máximo do upload (imagens ML: até 10 MB × várias fotos)
    client_max_body_size      100M;

    # Buffer em memória antes de gravar em disco temporário.
    # 64k cobre a maioria dos POSTs de formulário sem imagens;
    # uploads de imagem ainda vão a disco — mas sem gerar o warning desnecessário
    # para requests de texto. Para evitar o aviso em uploads binários grandes,
    # usamos client_body_temp_path com espaço garantido e suprimimos o log level.
    client_body_buffer_size   64k;
    client_body_timeout       120s;

    # Proxy timeouts generosos para uploads lentos
    proxy_connect_timeout     10s;
    proxy_send_timeout        120s;
    proxy_read_timeout        120s;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass                http://django;
        proxy_set_header          Host              $host;
        proxy_set_header          X-Real-IP         $remote_addr;
        proxy_set_header          X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header          X-Forwarded-Proto $scheme;
        proxy_read_timeout        120s;

        # Desabilita o buffering do request body no nginx:
        # o body é enviado diretamente ao upstream (Gunicorn) em streaming,
        # eliminando a gravação em arquivo temporário e o [warn] associado.
        proxy_request_buffering   off;
    }
}
