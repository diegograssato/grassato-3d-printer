# ──────────────────────────────────────────────
# docker-compose de produção — MySQL + Redis
# Uso: docker compose up -d --build
# ──────────────────────────────────────────────

services:

  # ── MySQL 8 ──────────────────────────────────
  db:
    image: mysql:8.0
    container_name: grassato-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-grassato3d}
      MYSQL_USER: ${DB_USER:-grassato}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootchangeme}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: grassato-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Django + Gunicorn ─────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grassato-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-insecure-key-change-me}
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,7b79-45-163-174-187.ngrok-free.app"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://localhost:8000,https://7b79-45-163-174-187.ngrok-free.app"
      ML_CALLBACK_URI: "https://7b79-45-163-174-187.ngrok-free.app/integracoes/ml/callback/"
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME:-grassato3d}
      DB_USER: ${DB_USER:-grassato}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0            
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      GUNICORN_WORKERS: "3"
      GUNICORN_THREADS: "4"
      # Superusuário criado automaticamente na primeira inicialização
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@grassato.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin123}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - backend
      - frontend

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grassato-celery
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A config worker
      --loglevel=debug
      --queues=ml_oauth,ml_orders,ml_status,ml_sync,default
      --concurrency=2
      --hostname=celery@%h
    environment:
      SECRET_KEY: ${SECRET_KEY:-insecure-key-change-me}
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,7b79-45-163-174-187.ngrok-free.app"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://localhost,https://7b79-45-163-174-187.ngrok-free.app"
      ML_CALLBACK_URI: "https://7b79-45-163-174-187.ngrok-free.app/integracoes/ml/callback/"
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME:-grassato3d}
      DB_USER: ${DB_USER:-grassato}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media_files:/app/media
    networks:
      - backend

  # ── Celery Flower (Monitoramento Web) ─────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grassato-flower
    restart: unless-stopped
    command: >
      celery -A config flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
  # ── Nginx (proxy reverso + static files) ─────
  nginx:
    image: nginx:1.27-alpine
    container_name: grassato-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - static_files:/usr/share/nginx/html/static:ro
      - media_files:/usr/share/nginx/html/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend

volumes:
  mysql_data:
  redis_data:
  static_files:
  media_files:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
